    case 'g-del': { const g = S.goals.find(x=>x.id===sheetCtx.draft.id); if (g){ g.deleted = true; touch(g);} closeSheet(); commit(); break; }
    case 'act-save': { const v = parseInt(($('#actIn')||{}).value?.replace(/[^0-9]/g,'')||'0',10); if (!v){ toast('받은 금액을 넣어 주세요'); break; } S.settings.salaryActual[btn.dataset.m] = v; touch(S.settings); commit(); toast('받은 금액을 저장했어요. 다음 예상에 반영해요.'); break; }
    case 'act-edit': { delete S.settings.salaryActual[btn.dataset.m]; touch(S.settings); commit(); setTimeout(()=>{ const i = $('#actIn'); if (i) i.focus(); }, 50); break; }
    case 'act-del': delete S.settings.salaryActual[btn.dataset.m]; touch(S.settings); commit(); break;
    case 'sv-today-rate': { readSaving(); const d = sheetCtx.draft, r = fxRate(d.cur); if (r){ d.rate = +(r*curUnit(d.cur)).toFixed(2); d.amount = Math.round((+d.fx||0)*d.rate/curUnit(d.cur)); } drawSaving(); break; }
    case 'fx-refresh': loadFx(true); render(); break;
    case 'fx-watch': { const c = btn.dataset.c, w = S.settings.fxWatch || []; S.settings.fxWatch = w.includes(c) ? w.filter(x=>x!==c) : w.concat(c); touch(S.settings); commit(); break; }
    case 'tr-add': openTransit(btn.dataset.m); break;
    case 'tr-save': {
      readTransit(); const d = sheetCtx.draft;
      if (!d.amount){ toast('받은 금액을 넣어 주세요'); break; }
      const rec = touch({ id: uid(), date: d.date, time:'', amount: d.amount, merchant:'교통비 환급', category:'교통', method: d.method, pay: payFor(d.method), memo: `${monthLabel(d.forM)}분`, refund: true, source:'manual', kind:'transit-refund', refundFor: d.forM });
      S.tx.push(rec); closeSheet(); commit(); toast(`교통비 환급 ${won(d.amount)}을 적었어요`); break;
    }
    case 'lump-add': openLump({card: btn.dataset.card, bill: btn.dataset.bill, month: btn.dataset.m}); break;
    case 'lump-edit': openLump({id}); break;
    case 'lump-save': {
      const d = sheetCtx.draft; d.amount = parseInt(($('#lumpAmt').value||'').replace(/[^0-9]/g,''),10)||0; d.billDate = $('#lumpDate').value;
      if (!d.amount){ toast('결제 금액을 넣어 주세요'); break; }
      const ex = S.bills.find(b => !b.deleted && b.cardId===d.cardId && b.billDate===d.billDate && b.id!==d.id);
      if (ex){ ex.deleted = true; touch(ex); }
      const prev = d.id && S.bills.find(b=>b.id===d.id);
      const rec = touch({id: d.id || uid(), cardId:d.cardId, billDate:d.billDate, amount:d.amount});
      if (prev) Object.assign(prev, rec); else S.bills.push(rec);
      closeSheet(); commit(); toast('결제 금액을 저장했어요'); break;
    }
    case 'lump-del': { const b = S.bills.find(x=>x.id===sheetCtx.draft.id); if (b){ b.deleted = true; touch(b); } closeSheet(); commit(); break; }
    case 'wd': { const d = +btn.dataset.d, sc = S.settings.salaryCalc; sc.days = sc.days.includes(d) ? sc.days.filter(x=>x!==d) : sc.days.concat(d).sort(); touch(S.settings); commit(); break; }
    case 'sal-auto': S.settings.salaryCalc.auto = btn.dataset.v === '1'; touch(S.settings); commit(); break;
    case 'off-add': { const d = $('#offDate').value; if (!d){ toast('날짜를 골라 주세요'); break; } const sc = S.settings.salaryCalc; sc.offDays = (sc.offDays||[]).filter(o=>o.date!==d).concat({date:d, absent: $('#offAbs').checked}); touch(S.settings); commit(); toast(HOLIDAYS[d] ? '그날은 이미 공휴일로 빠져 있어요' : '넣었어요. 월급을 다시 계산했어요'); break; }
    case 'off-del': { const sc = S.settings.salaryCalc; sc.offDays = (sc.offDays||[]).filter(o=>o.date!==btn.dataset.d); touch(S.settings); commit(); break; }
    case 'add-al': S.settings.allowance.push({day:1,amount:0}); touch(S.settings); commit(); break;
    case 'al-man': { const a = S.settings.allowance[+btn.dataset.i]; if (a){ const v = parseInt(($('#al-a-'+btn.dataset.i)||{}).value?.replace(/[^0-9]/g,'')||a.amount,10)||0; a.amount = v*10000; touch(S.settings); commit(); toast(`${krRead(a.amount)}으로 고쳤어요`); } break; }
    case 'del-al': S.settings.allowance.splice(+btn.dataset.i,1); touch(S.settings); commit(); break;
    case 'add-card': S.settings.cards.push({id:uid(), company:'새 카드사', name:'새 카드', kind:'check', billDay:14, cycleStart:1, keys:'', color:'#A38B74'}); touch(S.settings); commit(); break;
    case 'add-cat': { const v = $('#newCat').value.trim(); if (v && !S.settings.categories.includes(v)){ S.settings.categories.splice(S.settings.categories.length-1,0,v); touch(S.settings); commit(); } break; }
    case 'del-cat': S.settings.categories = S.settings.categories.filter(c=>c!==btn.dataset.c); touch(S.settings); commit(); break;
    case 'sms-test': {
      const p = parseSms($('#smsTest').value);
      const miss = v => v ? esc(v) : '<span>못 찾았어요</span>';
      $('#smsOut').innerHTML = p.ok ? `<dl class="parsed"><dt>금액</dt><dd class="num">${p.refund?'취소 ':''}${won(p.amount)}</dd><dt>카드</dt><dd class="${p.card?'':'miss'}">${p.card?esc(p.card.name)+' · '+({credit:'신용',check:'체크',small:'소액신용'}[p.pay]):'못 알아봤어요 (아래 카드 단어 확인)'}</dd><dt>날짜</dt><dd>${md(p.date)} ${esc(p.time)}</dd><dt>가게</dt><dd class="${p.merchant?'':'miss'}">${miss(p.merchant)}</dd><dt>카테고리</dt><dd>${esc(p.category)}</dd></dl><div class="row" style="margin-top:8px"><button class="btn sm main" data-act="sms-use" type="button">이대로 기록하기</button></div>` : note('bad','금액을 찾지 못했어요. 문자 전체를 붙여 넣었는지 확인해 주세요.');
      ui.lastParse = p; break;
    }
    case 'sms-use': if (ui.lastParse) openTx(txFromParse(ui.lastParse, {id:null})); break;
    case 'conn-save': {
      const url = $('#cUrl').value.trim(), pw = $('#cPw').value;
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ toast('script.google.com으로 시작하는 웹 앱 주소를 넣어 주세요'); break; }
      ls.set(CONN, {url, pw});
      try {
        const r = await api('ping');
        if (!r.ok) throw new Error(r.error||'연결 실패');
      } catch(err){ setSync('err', '연결 안 됨'); toast('연결하지 못했어요: ' + (err.message||err)); render(); break; }
      if (S.demo){ S = emptyState(); S.settings.updatedAt = 0; save(); }
      toast('연결했어요. 동기화할게요'); await sync(); break;
    }
    case 'sync-now': await sync(true); break;
    case 'conn-del': askConfirm('연결 끊기', '이 기기에서 구글 시트 연결을 끊어요. 시트의 기록은 그대로 남아요.', '끊기', () => { ls.del(CONN); setSync('', '기기에만 저장'); render(); }); break;
    case 'copy': try { await navigator.clipboard.writeText(btn.dataset.text); toast('복사했어요'); } catch(err){ toast('복사가 막혀 있어요. 직접 길게 눌러 복사해 주세요.'); } break;
    case 'export': {
      const txt = JSON.stringify(exportData());
      try { await navigator.clipboard.writeText(txt); toast('전체 데이터를 복사했어요. 메모장 등에 붙여 두세요.'); } catch(err){ openSheet(`<h2>백업용 데이터</h2><div class="small muted">아래 글을 모두 골라 복사해 두세요.</div><textarea class="input" style="min-height:200px">${esc(txt)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close" type="button">닫기</button></div>`); }
      break;
    }
    case 'load-demo': askConfirm('예시 데이터 보기', '지금 기록을 예시 데이터로 바꿔요. 구글 시트에 연결돼 있다면 연결을 먼저 끊어 주세요.', '바꾸기', () => { if (conn()) { toast('연결을 먼저 끊어 주세요'); return; } S = makeDemo(); commit({noSync:true}); }); break;
    case 'reset': askConfirm('모두 지우기', '이 기기의 기록과 설정을 모두 지워요. 구글 시트에 있는 기록은 남아 있어요.', '모두 지우기', () => { S = emptyState(); S.settings.updatedAt = 0; commit({noSync:true}); }); break;
    case 'start-real': openStart(); break;
    case 'start-ok': {
      const al = [...document.querySelectorAll('[id^="st-"]')].map(i=>({day:+i.dataset.day, amount: parseInt(i.value.replace(/[^0-9]/g,''),10)||0}));
      const fresh = emptyState(); fresh.settings.allowance = al; fresh.settings.startDate = today(); touch(fresh.settings);
      S = fresh; closeSheet(); commit(); toast('시작했어요. 첫 기록을 남겨 보세요.'); break;
    }
    case 'confirm-ok': { const f = sheetCtx && sheetCtx.onOk; closeSheet(); if (f) f(); break; }
  }
});
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2400); }

/* ============ 구글 시트 동기화 ============ */
const conn = () => { const c = ls.get(CONN); return c && c.url ? c : null; };
let syncState = {cls:'', text:'기기에만 저장', at:null};
function setSync(cls, text){ syncState.cls = cls; syncState.text = text; renderSync(); }
function renderSync(){ const b = $('#syncBtn'); b.className = 'sync ' + (syncState.cls||''); b.querySelector('span').textContent = syncState.text; const i = document.getElementById('syncInfo'); if (i) i.textContent = syncInfo(); }
function syncInfo(){ if (!conn()) return '아직 연결하지 않았어요. 지금은 이 기기에만 저장돼요.'; return syncState.at ? `마지막 동기화 ${new Date(syncState.at).toLocaleString('ko-KR')}` : '연결돼 있어요.'; }
async function api(action, payload={}){
  const c = conn(); if (!c) throw new Error('연결 안 됨');
  const res = await fetch(c.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action, pw:c.pw}, payload)) });
  if (!res.ok) throw new Error('응답 ' + res.status);
  return res.json();
}
function exportData(){ return { settings:S.settings, tx:S.tx, savings:S.savings, goals:S.goals, fixed:S.fixed, special:S.special, bills:S.bills, images:S.images }; }
function mergeList(local, remote){
  const map = new Map(); (local||[]).forEach(x => map.set(x.id, x));
  (remote||[]).forEach(r => { const l = map.get(r.id); if (!l || (+r.updatedAt||0) > (+l.updatedAt||0)) map.set(r.id, r); });
  return [...map.values()];
}
let syncing = false, syncTimer = null;
function scheduleSync(){ if (!conn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(()=>sync(), 1500); }
async function sync(loud){
  if (!conn() || syncing) return;
  syncing = true; setSync('busy','동기화 중');
  try {
    const r = await api('load');
    if (!r.ok) throw new Error(r.error || '불러오기 실패');
    const d = r.data || {};
    if (d.settings && (+d.settings.updatedAt||0) > (+S.settings.updatedAt||0)) S.settings = Object.assign(defaultSettings(), d.settings);
    S.tx = mergeList(S.tx, d.tx); S.savings = mergeList(S.savings, d.savings); S.goals = mergeList(S.goals, d.goals); S.fixed = mergeList(S.fixed, d.fixed); S.special = mergeList(S.special, d.special); S.bills = mergeList(S.bills, d.bills);
    for (const [k,v] of Object.entries(d.images||{})) if (!S.images[k] || (+v.updatedAt||0) > (+S.images[k].updatedAt||0)) S.images[k] = v;
    S.demo = false;
    const acks = []; let added = 0;
    for (const m of (r.inbox||[])){
      acks.push(m.id);
      const tid = 'sms-' + m.id;
      if (S.tx.some(t=>t.id===tid)) continue;
      const p = parseSms(m.text);
      if (!p.ok) continue;
      S.tx.push(txFromParse(p, {id:tid})); added++;
    }
    save();
    const w = await api('save', {data: exportData(), ack: acks});
    if (!w.ok) throw new Error(w.error || '저장 실패');
    syncState.at = Date.now(); setSync('on','시트 연결됨');
    render();
    if (added) toast(`결제 문자 ${added}건을 기록했어요`);
    else if (loud) toast('동기화했어요');
  } catch(err){
    setSync('err','동기화 안 됨');
    if (loud) toast('동기화하지 못했어요: ' + (err.message||err));
  } finally { syncing = false; }
}
$('#syncBtn').addEventListener('click', () => { if (conn()) sync(true); else location.hash = '#prefs'; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ render(); sync(); } });
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 90000);

/* ============ 시작 ============ */
$('#hdrMark').innerHTML = LOGO;
$('#loaderMark').innerHTML = WALLET;
if (firstRun) save();
route();
if (conn()) { setSync('on','시트 연결됨'); sync(); }
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(() => $('#loader').classList.add('done'), reduce ? 0 : 1750);
setTimeout(() => { const l = $('#loader'); if (l) l.remove(); }, reduce ? 50 : 2150);
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
