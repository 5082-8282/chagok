<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="차곡차곡">
<title>차곡차곡</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314171C'/%3E%3Crect x='6' y='20' width='20' height='5' rx='1.6' fill='%233DC3A1'/%3E%3Crect x='8.5' y='13.5' width='16' height='5' rx='1.6' fill='%233DC3A1' opacity='.65'/%3E%3Crect x='11' y='7' width='11.5' height='5' rx='1.6' fill='%233DC3A1' opacity='.35'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 차곡차곡: 흰 카드와 차분한 회색 바탕, 숫자가 주인공. 포인트는 짙은 초록 하나. 한 줄 앱 칼럼(최대 560px) + 아래 탭 */
  --bg:#F3F4F6;
  --card:#FFFFFF;
  --line:#E3E6EB;
  --ink:#14171C;
  --muted:#6A7180;
  --faint:#9AA1AD;
  --accent:#0E7C66;
  --accent-soft:#E2F1EC;
  --accent-ink:#FFFFFF;
  --ok:#1C8A50;
  --ok-bg:#E5F4EB;
  --warn:#A86400;
  --warn-bg:#FBF0DC;
  --bad:#CC3A3F;
  --bad-bg:#FBE7E7;
  --chip:#F3F4F6;
  --shadow:0 1px 2px rgba(20,23,28,.04),0 4px 14px rgba(20,23,28,.04);
  --font:'IBM Plex Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --r:16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1014; --card:#171A20; --line:#272B34; --ink:#ECEEF2; --muted:#9AA1AE; --faint:#6B7280;
    --accent:#3DC3A1; --accent-soft:#143229; --accent-ink:#0E1014;
    --ok:#42C07A; --ok-bg:#16301F; --warn:#E3A23B; --warn-bg:#33270F; --bad:#F06A6E; --bad-bg:#3A1A1C; --chip:#20242C;
    --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1014; --card:#171A20; --line:#272B34; --ink:#ECEEF2; --muted:#9AA1AE; --faint:#6B7280;
  --accent:#3DC3A1; --accent-soft:#143229; --accent-ink:#0E1014;
  --ok:#42C07A; --ok-bg:#16301F; --warn:#E3A23B; --warn-bg:#33270F; --bad:#F06A6E; --bad-bg:#3A1A1C; --chip:#20242C;
  --shadow:none; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;letter-spacing:-0.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num,.big,.val,.amt{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;letter-spacing:-0.02em}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px calc(88px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 0 12px}
header.top .mark{width:28px;height:28px;flex:none}
header.top .brand{font-size:18px;font-weight:700;letter-spacing:-0.03em;line-height:1.1}
header.top .sub{color:var(--muted);font-size:12.5px}
header.top .grow{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--ok)}.sync.busy i{background:var(--warn)}.sync.err i{background:var(--bad)}
main{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:16px}
.card h3{font-size:15px}
.label{font-size:13px;color:var(--muted);font-weight:500}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.plain{background:var(--chip);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.main{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}

/* 홈 */
.hero .big{font-size:38px;font-weight:700;line-height:1.15;letter-spacing:-0.035em;margin:6px 0 4px}
.hero .big small{font-size:20px;font-weight:600;margin-left:2px}
.hero .big.neg{color:var(--bad)}
.breakdown{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.breakdown b{color:var(--ink);font-weight:600}
.bar{position:relative;height:8px;border-radius:999px;background:var(--chip);margin:16px 0 8px}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:999px}
.bar b.over{background:var(--bad)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--ink)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);margin:16px -18px -18px;}
.kpis > div{padding:14px 12px 14px 18px;display:flex;flex-direction:column;gap:2px}
.kpis > div + div{border-left:1px solid var(--line)}
.kpis .val{font-size:17px;font-weight:700;letter-spacing:-0.02em}
.kpis .val.bad{color:var(--bad)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.tile .val{font-size:20px;font-weight:700;letter-spacing:-0.025em}
.notice{display:flex;gap:10px;align-items:center;border-radius:12px;padding:11px 14px;font-size:14px;background:var(--card);border:1px solid var(--line)}
.notice.warn{background:var(--warn-bg);border-color:transparent}
.notice.bad{background:var(--bad-bg);border-color:transparent}
.notice.ok{background:var(--ok-bg);border-color:transparent}
.notice .grow{flex:1}
.demo{background:var(--ink);color:var(--card);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:13.5px}
.demo .btn{background:var(--card);border-color:var(--card);color:var(--ink);padding:6px 10px;font-size:13px;white-space:nowrap}
/* 지킨 날 기록 */
.days{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
@media (max-width:420px){.days{grid-template-columns:repeat(11,1fr)}}
.days i{aspect-ratio:1;border-radius:4px;background:var(--chip);display:block}
.days i.kept{background:var(--accent);opacity:.55}
.days i.nospend{background:var(--accent)}
.days i.over{background:var(--bad);opacity:.75}
.days i.today{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.days i.pre{background:transparent;border:1px dashed var(--line)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 > div{display:flex;flex-direction:column}
.stat3 .val{font-size:20px;font-weight:700;letter-spacing:-0.02em}
.keyrow{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.keyrow span{display:inline-flex;gap:5px;align-items:center}
.keyrow i{width:10px;height:10px;border-radius:3px;display:inline-block;background:var(--chip)}
/* 다가오는 출금 */
.up{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.up:last-child{border-bottom:0;padding-bottom:0}
.up .date{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--chip);padding:6px 0;line-height:1.15}
.up .date b{font-size:16px}
.up .date span{font-size:11px;color:var(--muted)}
.up .amt{font-weight:700}

/* 목록 */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .ic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--chip);color:var(--muted)}
.item .main{flex:1;min-width:0}
.item .t,.item .s{display:block}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12px;color:var(--muted)}
.item .amt{font-weight:700;white-space:nowrap}
.item .amt.refund{color:var(--ok)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:1px;background:var(--chip);color:var(--muted)}
.tag.later{background:var(--warn-bg);color:var(--warn)}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:14px 0 2px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}

/* 내역 */
.monthnav{display:flex;align-items:center;justify-content:space-between}
.monthnav h2{font-size:20px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.cats{display:flex;flex-direction:column;gap:9px}
.catrow{display:grid;grid-template-columns:84px 1fr 118px;gap:10px;align-items:center;font-size:13px;background:none;border:0;padding:2px 0;text-align:left;width:100%}
.catrow .track{height:8px;border-radius:999px;background:var(--chip);overflow:hidden}
.catrow .track b{display:block;height:100%;background:var(--accent);border-radius:999px}
.catrow .v{text-align:right}
.catrow.sel{font-weight:700}
.catrow.dim{opacity:.45}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{min-height:46px;border-radius:8px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;padding:2px;gap:1px}
.cal .d .n{font-weight:600}
.cal .d .v{font-size:10px;color:var(--muted);line-height:1.1}
.cal .d.kept{background:var(--accent-soft)}
.cal .d.nospend{background:var(--accent);color:var(--accent-ink)}
.cal .d.nospend .v{color:var(--accent-ink)}
.cal .d.over{background:var(--bad-bg)}
.cal .d.over .v{color:var(--bad)}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal .d.future,.cal .d.pre{background:transparent;color:var(--faint)}

/* 카드 */
.cc{display:flex;flex-direction:column;gap:12px}
.cc .head{display:flex;align-items:center;gap:12px}
.cc .chip{width:40px;height:26px;border-radius:6px;flex:none;position:relative}
.cc .chip::after{content:"";position:absolute;left:6px;top:8px;width:10px;height:8px;border-radius:2px;background:rgba(255,255,255,.55)}
.cc .name{font-size:16px;font-weight:700}
.cc .when{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc .when > div{background:var(--chip);border-radius:12px;padding:12px}
.cc .when .val{font-size:19px;font-weight:700;letter-spacing:-0.02em}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);position:relative;margin:4px 0 2px}
.timeline::before{content:"";position:absolute;left:16.6%;right:16.6%;top:7px;height:2px;background:var(--line)}
.timeline > div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;position:relative;font-size:12.5px;color:var(--muted)}
.timeline > div i{width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.timeline > div:last-child i{background:var(--accent)}
.timeline b{color:var(--ink);font-size:14px}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tips li::marker{color:var(--muted);font-weight:600}


/* 카드 슬라이드 */
.cochips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:-2px}
.cochips::-webkit-scrollbar{display:none}
.chip-b .cnt{margin-left:6px;font-size:11px;opacity:.55;font-variant-numeric:tabular-nums}
.deck{position:relative;z-index:0;isolation:isolate;margin:0 -16px;overflow:hidden;outline:none;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.deck:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);border-radius:12px}
.deck .cardface{position:absolute;left:50%;top:50%;flex:none;max-width:none;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s,filter .3s;will-change:transform;box-shadow:0 10px 26px rgba(10,12,16,.22);-webkit-user-drag:none}
.deck .cardface img{-webkit-user-drag:none;pointer-events:none}
.deck.dragging .cardface{transition:none}
.vdots{position:absolute;left:calc(50% + var(--cw,280px)/2 + 10px);top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:5px;z-index:300}
.vdots i{width:6px;height:6px;border-radius:999px;background:var(--line);transition:height .2s}
.vdots i.on{height:16px;background:var(--ink)}
.deck-hint{text-align:center;margin-top:-4px}

.crop{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:10px;overflow:hidden;background:var(--chip)}
.crop img{display:block;width:100%;height:auto;pointer-events:none}
.crop-box{position:absolute;box-shadow:0 0 0 9999px rgba(10,12,16,.55);outline:2px solid #fff;border-radius:6px;cursor:move}
.crop-box i{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.crop-box i[data-h="nw"]{left:-11px;top:-11px;cursor:nwse-resize}
.crop-box i[data-h="ne"]{right:-11px;top:-11px;cursor:nesw-resize}
.crop-box i[data-h="sw"]{left:-11px;bottom:-11px;cursor:nesw-resize}
.crop-box i[data-h="se"]{right:-11px;bottom:-11px;cursor:nwse-resize}
.crop-prev{display:flex;justify-content:center}
.crop-prev img{width:62%;aspect-ratio:1.586/1;border-radius:12px;box-shadow:0 6px 18px rgba(10,12,16,.18);background:var(--chip)}

.cardtop{display:flex;flex-direction:column;gap:2px}
.top-big{font-size:34px;font-weight:700;letter-spacing:-0.035em;font-variant-numeric:tabular-nums;line-height:1.2;margin:4px 0 2px}
.top-all{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.top-all b{color:var(--ink)}

.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 10px;margin:0 -16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail::before,.rail::after{content:"";flex:0 0 calc(11% - 12px)}
.cardface{flex:0 0 78%;max-width:340px;aspect-ratio:1.586/1;border-radius:14px;scroll-snap-align:center;position:relative;overflow:hidden;border:0;padding:0;background:var(--chip);box-shadow:0 8px 22px rgba(10,12,16,.16);transition:transform .25s ease,opacity .25s ease;color:#fff;text-align:left}
.rail .cardface:not(.sel){transform:scale(.92);opacity:.55}
.cardface img{width:100%;height:100%;object-fit:cover;display:block}
.cardface.gen{display:flex;flex-direction:column;justify-content:space-between;padding:16px 18px}
.cardface.gen::after{content:"";position:absolute;right:-30%;top:-60%;width:90%;height:160%;border-radius:50%;background:rgba(255,255,255,.08)}
.cardface .f-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.cardface .f-name{font-size:19px;font-weight:700;letter-spacing:-0.02em}
.cardface .f-nfc{width:20px;height:20px;opacity:.8}
.cardface .f-chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#E9D79A,#C2A55B);position:relative;z-index:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cardface .f-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:12.5px;opacity:.92;position:relative;z-index:1}
.cardface .f-kind{font-weight:700;letter-spacing:.12em;font-size:11px}
.dots{display:flex;justify-content:center;gap:6px;margin:-2px 0 2px}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--line);transition:width .2s}
.dots i.on{width:18px;background:var(--ink)}
.cd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cd-name{font-size:19px;font-weight:700;letter-spacing:-0.02em}
.cd-next{background:var(--chip);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.cd-big{font-size:30px;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.cd-rows{display:flex;flex-direction:column}
.cd-rows > div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.cd-rows > div:last-child{border-bottom:0}
.cd-explain{margin:0;padding:12px 14px 12px 30px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink)}
.cd-explain li::marker{color:var(--accent)}
.photo-row{display:flex;align-items:center;gap:10px}
.photo-row img{width:64px;aspect-ratio:1.586/1;object-fit:cover;border-radius:6px;border:1px solid var(--line)}

/* 정기·특별 지출 합계 */
.plan-sum{display:flex;flex-direction:column;background:var(--chip);border-radius:12px;padding:6px 14px}
.plan-sum > div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:13.5px}
.plan-sum .tot{border-top:1px solid var(--line);margin-top:2px;padding-top:10px;font-weight:700}
.plan-sum .tot b{color:var(--accent)}

.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.actual{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.actual > b{font-size:20px;letter-spacing:-0.02em}
.actual .small{color:var(--ok)} .actual .small.neg{color:var(--warn)}

.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rates > div{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rates b{font-size:22px;letter-spacing:-0.02em;color:var(--accent)}

.fx-hero{background:var(--chip);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.fx-big{font-size:34px;font-weight:700;letter-spacing:-0.035em;font-variant-numeric:tabular-nums;line-height:1.2}
.fx-big small{font-size:18px;font-weight:600;margin-left:2px}
.fx-mini{display:flex;flex-direction:column;gap:8px;font-size:14px}
.fx-mini em{font-style:normal;font-weight:600;margin-left:4px}
.fx-mini em.gain{color:var(--ok)} .fx-mini em.loss{color:var(--bad)}
.fx-set summary{font-size:13px;color:var(--muted);font-weight:600}
.fx-list{display:flex;flex-direction:column}
.fx-row{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.fx-row:last-child{border-bottom:0}
.fx-rate{font-size:14px}
.fx-rate b{font-size:17px}
.fx-hold{display:flex;flex-direction:column;gap:1px;font-size:12.5px;color:var(--muted)}
.fx-hold b{color:var(--ink)}
.fx-hold em{font-style:normal;font-weight:600}
.fx-hold em.gain{color:var(--ok)} .fx-hold em.loss{color:var(--bad)}

/* 월별 기록 표 */
.mtable{display:flex;flex-direction:column;margin-top:6px}
.mrow{display:grid;grid-template-columns:1.1fr 1fr 1fr .8fr;gap:8px;padding:10px 8px;border:0;border-bottom:1px solid var(--line);background:none;text-align:right;font-size:14px;width:100%;border-radius:0}
.mrow span:first-child{text-align:left;font-weight:600}
.mrow.mhead{font-size:12px;color:var(--muted);font-weight:500;padding-top:4px;line-height:1.3;align-items:end}
.mrow small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.mrow b{font-weight:700;color:var(--accent)}
.mrow.mhead span:first-child{font-weight:500}
.mrow:last-child{border-bottom:0}
.mrow.sel{background:var(--accent-soft);border-radius:8px}

/* 저축 */
.goal{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0;padding-bottom:0}
.goal .track{height:8px;border-radius:999px;background:var(--chip);overflow:hidden}
.goal .track b{display:block;height:100%;background:var(--accent);border-radius:999px}

/* 설정 */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.al-hint{grid-column:1/-1;margin-top:-4px;min-height:0}
.input,select.input{min-height:44px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-width:0}
textarea.input{min-height:110px;resize:vertical;font-size:14px}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.setrow{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:end}
.cardset{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--chip)}
.cardset .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-b{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}
.chip-b.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip-b .x{margin-left:6px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--chip);border-radius:6px;padding:1px 6px;word-break:break-all}
pre.code{display:block;padding:12px 14px;white-space:pre-wrap;margin:0;line-height:1.7}
.parsed{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;background:var(--chip);border-radius:12px;padding:12px 14px;margin:0}
.parsed dt{color:var(--muted)}
.parsed dd{margin:0;font-weight:600}
.parsed dd.miss{color:var(--bad)}

/* 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb, var(--card) 94%, transparent);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--faint);text-decoration:none;font-size:11.5px;font-weight:500}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--ink);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(80px + env(safe-area-inset-bottom));z-index:21;border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:13px 18px;font-weight:700;box-shadow:0 6px 20px rgba(14,124,102,.28);display:flex;gap:6px;align-items:center}

/* 입력 창 */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.4);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:18px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88%}}
.amount-in{font-size:32px;font-weight:700;letter-spacing:-0.03em;border:0;border-bottom:2px solid var(--line);background:transparent;width:100%;padding:4px 0;border-radius:0;font-variant-numeric:tabular-nums}
.amount-in:focus{outline:none;border-bottom-color:var(--accent)}
.seg{align-self:flex-start;display:inline-flex;border-radius:10px;padding:3px;background:var(--chip);gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13.5px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}

/* 로딩 */
#loader{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .35s}
#loader.done{opacity:0;pointer-events:none}
#loader .wallet{width:min(250px,66vw);height:auto;overflow:visible}
#loader .bill{opacity:0;animation:billIn .46s cubic-bezier(.3,.75,.25,1) forwards;transform-box:fill-box}
#loader .w-all{transform-box:fill-box;transform-origin:50% 100%;animation:bump .3s ease-out .9s}
#loader .word{font-size:30px;font-weight:700;letter-spacing:-0.035em;opacity:0;animation:fade .4s ease-out 1s forwards}
@keyframes billIn{0%{opacity:0;transform:translateY(-78px) rotate(-1.5deg)}30%{opacity:1}100%{opacity:1;transform:none}}
@keyframes bump{0%,100%{transform:none}45%{transform:translateY(3px) scale(1.02,.97)}}
@keyframes stack{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
@media (max-width:400px){
  .hero .big{font-size:34px}
  .setrow{grid-template-columns:80px 1fr auto}
  .catrow{grid-template-columns:72px 1fr 104px}
  .kpis > div{padding:12px 8px 12px 14px}
}
</style>
</head>
<body>

</div>

<div id="app">
  <header class="top">
    <div class="mark" id="hdrMark"></div>

      <div class="brand">차곡차곡</div>

</div>

<nav class="tabs" aria-label="화면">
  <div class="in">
    <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>오늘</a>
    <a href="#history" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>내역</a>
    <a href="#cards" data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18M7 15h4"/></svg>카드</a>
    <a href="#savings" data-tab="savings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="8" rx="7" ry="3"/><path d="M5 8v4c0 1.7 3.1 3 7 3s7-1.3 7-3V8M5 12v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/></svg>저축</a>
    <a href="#prefs" data-tab="prefs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>설정</a>
  </div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
/* ============ 기본 도구 ============ */
const KEY = 'chagok-v1', CONN = 'chagok-conn';
const FIXED_CAT = '고정비·구독';
const SPECIAL_CAT = '특별 지출';
const PLANNED = c => c === FIXED_CAT || c === SPECIAL_CAT;
const DEFAULT_CATS = ['식비','카페·간식','편의점','배달','교통','쇼핑','생활','문화·취미','의료','선물·경조','고정비·구독','특별 지출','기타'];
const CAT_WORDS = [
  ['카페·간식',['스타벅스','커피','카페','메가','컴포즈','이디야','투썸','빽다방','베이커리','파리바게','뚜레쥬르','배스킨','설빙','디저트']],
  ['편의점',['GS25','지에스25','CU','씨유','세븐일레븐','이마트24','미니스톱','편의점']],
  ['배달',['배달의민족','배민','우아한','쿠팡이츠','요기요']],
  ['교통',['택시','카카오T','카카오모빌','티머니','지하철','버스','코레일','SRT','주유','고속','레일']],
  ['쇼핑',['쿠팡','네이버페이','11번가','G마켓','옥션','무신사','29CM','지그재그','에이블리','올리브영','다이소','아트박스']],
  ['생활',['이마트','홈플러스','롯데마트','마트','세탁','약국']],
  ['의료',['병원','의원','치과','한의원','내과','안과','피부과']],
  ['문화·취미',['CGV','메가박스','롯데시네마','교보','영풍','알라딘','예스24','yes24','공방','넷플릭스','멜론','스포티파이']],
  ['식비',['김밥','식당','국밥','분식','치킨','피자','버거','맥도날드','롯데리아','서브웨이','한솥','본죽','마라','초밥','돈까스','샐러드']],
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (Math.round(n)||0).toLocaleString('ko-KR') + '원';
const wonShort = n => { n = Math.round(n)||0; const a=Math.abs(n); if (a >= 10000) return (n/10000).toFixed(a>=100000?0:1).replace(/\.0$/,'') + '만'; return n.toLocaleString('ko-KR'); };
const sum = a => a.reduce((x,y)=>x+(+y||0),0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ym = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1); };
const dim = (y,m) => new Date(y, m, 0).getDate(); // m: 1~12
const today = () => ymd(new Date());
const WD = ['일','월','화','수','목','금','토'];
const md = s => { const d = toDate(s); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const mdShort = s => { const d = toDate(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const daysBetween = (a,b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const live = arr => (arr||[]).filter(x => !x.deleted);
const signed = t => t.refund ? -t.amount : t.amount;
function hash(s){ let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i)) >>> 0; return h.toString(36); }

const mem = {};
const ls = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ delete mem[k]; try { localStorage.removeItem(k); } catch(e){} }
};

/* ============ 상태 ============ */
function defaultSettings(){
  return {
    updatedAt: 0,
    allowance: [{day:1,amount:0},{day:23,amount:0},{day:25,amount:0}],
    salaryDay: 10,
    salaryAmount: 0,
    salaryToBudget: 0,
    salaryCalc: defaultSalaryCalc(),
    transit: {rate: 20},
    fxMain: 'JPY',
    fxWatch: [],
    salaryActual: {'2026-10': 851330, '2026-11': 890570},
    startDate: today(),
    cards: [
      {id:'hana', company:'하나', name:'하나', kind:'credit', billDay:13, cycleStart:1, keys:'하나', color:'#5BA89A'},
      {id:'woori', company:'우리', name:'우리', kind:'hybrid', billDay:11, cycleStart:28, keys:'우리', color:'#4F86C6'},
      {id:'shinhan', company:'신한', name:'신한', kind:'hybrid', billDay:11, cycleStart:28, keys:'신한', color:'#3D5FA8'}
    ],
    categories: DEFAULT_CATS.slice(),
    rules: {}
  };
}
function emptyState(){ return { v:1, demo:false, settings: defaultSettings(), tx:[], savings:[], goals:[], fixed:[], special:[], bills:[], images:{} }; }

let S = ls.get(KEY);
let firstRun = !S;
if (!S || (S.demo && S.demoV !== 9)) { S = makeDemo(); firstRun = true; }
S.settings = Object.assign(defaultSettings(), S.settings || {});
S.settings.cards.forEach(c => { if (!c.company) c.company = c.name; });
S.settings.salaryCalc = Object.assign(defaultSalaryCalc(), S.settings.salaryCalc || {});
S.settings.salaryActual = S.settings.salaryActual || {};
S.settings.transit = Object.assign({rate:20}, S.settings.transit || {});
S.settings.fxMain = S.settings.fxMain || 'JPY';
['tx','savings','goals','fixed','special','bills'].forEach(k => S[k] = S[k] || []);
if (!S.settings.categories.includes(SPECIAL_CAT)) S.settings.categories.splice(Math.max(0, S.settings.categories.indexOf('기타')), 0, SPECIAL_CAT);
S.images = S.images || {};

const ui = { planTab:'fixed', tab:'today', month: ym(new Date()), cat:null, card:null, lastByCo:{}, dragAt:0 };

function save(){ ls.set(KEY, S); }
function commit(opts={}){ save(); render(); if (!opts.noSync) scheduleSync(); }
function touch(o){ o.updatedAt = Date.now(); return o; }
function cardById(id){ return S.settings.cards.find(c => c.id === id); }
function methodLabel(t){
  if (t.method === 'cash') return '현금';
  if (t.method === 'transfer') return '계좌이체';
  const c = cardById(t.method); const n = c ? c.name : '카드';
  if (t.pay === 'credit') return n + ' 신용';
  if (t.pay === 'small') return n + ' 소액신용';
  return n + ' 체크';
}
const laterPay = t => t.pay === 'credit' || t.pay === 'small';

/* ============ 예시 데이터 ============ */
function makeDemo(){
  const st = emptyState();
  st.demo = true; st.demoV = 9;
  st.settings.allowance = [{day:1,amount:200000},{day:23,amount:100000},{day:25,amount:100000}];
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth()-1, 1);
  st.settings.startDate = ymd(start);
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed-1)/2147483646; };
  const shops = [
    ['메가커피','카페·간식',2000,4500],['스타벅스','카페·간식',4500,7000],['GS25','편의점',1500,7000],['CU','편의점',1200,6000],
    ['김밥천국','식비',4500,9000],['한솥도시락','식비',5000,8000],['배달의민족','배달',13000,24000],['카카오T','교통',4800,12000],
    ['올리브영','쇼핑',8000,26000],['다이소','생활',3000,12000],['쿠팡','쇼핑',9000,32000],['교보문고','문화·취미',12000,18000],['이마트24','편의점',2000,5000]
  ];
  const methods = [['hana','credit'],['hana','credit'],['woori','check'],['shinhan','check'],['woori','small'],['shinhan','check']];
  const tx = [];
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
    const isToday = ymd(d) === ymd(now);
    let n = rnd() < 0.18 ? 0 : (rnd() < 0.55 ? 1 : 2);
    if (isToday) n = 1;
    for (let i=0;i<n;i++){
      const s = shops[Math.floor(rnd()*shops.length)];
      const amt = Math.round((s[2] + rnd()*(s[3]-s[2]))/100)*100;
      const m = methods[Math.floor(rnd()*methods.length)];
      tx.push({id:uid()+i, date:ymd(d), time:`${pad(11+Math.floor(rnd()*9))}:${pad(Math.floor(rnd()*60))}`, amount:amt, merchant:s[0], category:s[1], method:m[0], pay:m[1], memo:'', source: rnd()<0.7?'sms':'manual', refund:false, updatedAt:1});
    }
  }
  // 고정비가 실제로 나간 내역
  for (const mo of [start, new Date(now.getFullYear(), now.getMonth(), 1)]) {
    const y = mo.getFullYear(), m = mo.getMonth();
    const p = new Date(y, m, 5); if (p <= end) tx.push({id:uid()+'y', date:ymd(p), time:'09:00', amount:14900, merchant:'유튜브 프리미엄', category:FIXED_CAT, method:'hana', pay:'credit', memo:'', source:'sms', refund:false, updatedAt:1});
  }

function defaultSalaryCalc(){ return { shift:'before', calibrate:true, auto:true, wage:10320, days:[1,2,3,4,5], start:'14:00', end:'17:50', breakMin:0, period:'prev', paidHoliday:false, weekly:true, rate:0, offDays:[] }; }

function payDayOf(y, m){
  const st = S.settings, rule = (st.salaryCalc||{}).shift || 'before';
  let d = new Date(y, m-1, Math.min(+st.salaryDay||10, dim(y,m)));

// 받은 금액이 적힌 달은 그 금액을, 아니면 계산값에 '받은 금액/계산값' 평균 비율을 곱해 예상
function salaryRatio(){
  const st = S.settings, act = st.salaryActual || {};
  if (!(st.salaryCalc||{}).auto || (st.salaryCalc||{}).calibrate === false) return {ratio:1, n:0};

function salaryCalcRaw(payYm){

    ` : `

}

function monthCalc(ymStr){
  const [y,m] = ymStr.split('-').map(Number);
  const days = dim(y,m);
  const pocket = sum(S.settings.allowance.map(a=>a.amount));
  const salNet = salaryFor(ymStr).net;
  const fromSalary = Math.min(+S.settings.salaryToBudget||0, salNet || Infinity);
  const allowance = pocket + fromSalary;
  const fixed = sum(live(S.fixed).map(f=>f.amount));
  const specials = live(S.special).filter(x => (x.date||'').startsWith(ymStr));
  const special = sum(specials.map(x=>x.amount));
  const free = allowance - fixed - special;
  const daily = Math.max(0, Math.floor(free / days));
  const txs = live(S.tx).filter(t => t.date.startsWith(ymStr));
  const flex = txs.filter(t => !PLANNED(t.category));
  const spent = sum(flex.map(signed));
  const fixedPaid = sum(txs.filter(t => PLANNED(t.category)).map(signed));
  const byDay = {};
  flex.forEach(t => byDay[t.date] = (byDay[t.date]||0) + signed(t));
  const t0 = today(), start = S.settings.startDate || t0;
  const list = [];
  let kept = 0, over = 0, nospend = 0, counted = 0;
  for (let d=1; d<=days; d++){
    const ds = `${ymStr}-${pad(d)}`;
    const v = byDay[ds] || 0;
    let status;
    if (ds > t0) status = 'future';
    else if (ds < start) status = 'pre';
    else if (ds === t0) status = v <= daily ? 'today-ok' : 'today-over';
    else if (v <= 0) status = 'nospend';
    else if (v <= daily) status = 'kept';
    else status = 'over';
    if (status === 'kept' || status === 'nospend' || status === 'today-ok') kept++;
    if (status === 'nospend') nospend++;
    if (status === 'over' || status === 'today-over') over++;
    if (status !== 'future' && status !== 'pre') counted++;
    list.push({ds, d, v, status});
  }
  // 연속으로 지킨 날 (오늘이 아직 예산 안이면 오늘 포함)
  let streak = 0;
  for (let i = list.length-1; i >= 0; i--){
    const s = list[i].status;
    if (s === 'future') continue;
    if (s === 'today-ok' || s === 'kept' || s === 'nospend') streak++;
    else if (s === 'today-over' || s === 'over' || s === 'pre') break;
  }
  const isCur = ymStr === ym(new Date());
  const dayNo = isCur ? new Date().getDate() : (ymStr < ym(new Date()) ? days : 0);
  const lumps = lumpsFor(ymStr), lumpSum = sum(lumps.map(l=>l.extra));
  const laterSum = sum(txs.filter(laterPay).map(signed)) + lumpSum;
  const nowSum = sum(txs.filter(t => !laterPay(t)).map(signed));
  return { lumps, lumpSum, y, m, days, allowance, pocket, fromSalary, fixed, special, specials, free, daily, spent: spent + lumpSum, fixedPaid, remaining: free - spent - lumpSum, byDay, list, kept, over, nospend, counted, streak, dayNo, isCur, laterSum, nowSum, txs };
}

function billDateFor(dateStr, card){
  const [y,m,d] = dateStr.split('-').map(Number);
  const cs = +card.cycleStart || 1;
  const add = cs <= 1 ? 1 : (d >= cs ? 2 : 1);
  const b = new Date(y, m-1+add, 1);
  return ymd(new Date(b.getFullYear(), b.getMonth(), Math.min(+card.billDay||1, dim(b.getFullYear(), b.getMonth()+1))));
}
function periodFor(billStr, card){
  const b = toDate(billStr); const cs = +card.cycleStart || 1;
  if (cs <= 1){
    const s = new Date(b.getFullYear(), b.getMonth()-1, 1), e = new Date(b.getFullYear(), b.getMonth(), 0);
    return [ymd(s), ymd(e)];
  }
  const sm = new Date(b.getFullYear(), b.getMonth()-2, 1), em = new Date(b.getFullYear(), b.getMonth()-1, 1);
  const s = new Date(sm.getFullYear(), sm.getMonth(), Math.min(cs, dim(sm.getFullYear(), sm.getMonth()+1)));
  const e = new Date(em.getFullYear(), em.getMonth(), Math.min(cs-1, dim(em.getFullYear(), em.getMonth()+1)));
  return [ymd(s), ymd(e)];
}
function cycleText(card){
  const cs = +card.cycleStart || 1;
  return cs <= 1 ? '지난달 1일 ~ 말일 사용분' : `전전달 ${cs}일 ~ 지난달 ${cs-1}일 사용분`;
}
/* 결제 금액만 적기: 내역을 다 못 적은 달은 카드사 결제 금액만 넣는다 */
function billRec(cardId, billDate){ return live(S.bills).find(b => b.cardId === cardId && b.billDate === billDate); }
function recordedFor(card, billDate){
  const [a, z] = periodFor(billDate, card);
  return sum(live(S.tx).filter(t => t.method === card.id && laterPay(t) && t.date >= a && t.date <= z).map(signed));
}
// 이 달(이용기간이 끝나는 달)에 '내역 없음'으로 더할 금액 = 결제 금액 − 이미 적은 내역
function lumpsFor(ymStr){
  const out = [];
  for (const b of live(S.bills)){
    const card = cardById(b.cardId); if (!card) continue;
    const per = periodFor(b.billDate, card);
    if (!per[1].startsWith(ymStr)) continue;
    const recorded = recordedFor(card, b.billDate);
    out.push({ id:b.id, card, billDate:b.billDate, period:per, amount:+b.amount, recorded, extra: Math.max(0, +b.amount - recorded) });
  }
  return out;
}
function recentBillDates(card){
  const out = [], now = new Date();
  for (let k=-6; k<=1; k++){
    const mo = new Date(now.getFullYear(), now.getMonth()+k, 1);
    out.push(ymd(new Date(mo.getFullYear(), mo.getMonth(), Math.min(+card.billDay||1, dim(mo.getFullYear(), mo.getMonth()+1)))));
  }
  return out;
}
function cardBills(card){
  const t0 = today();
  const txs = live(S.tx).filter(t => t.method === card.id && laterPay(t));
  const groups = {};
  txs.forEach(t => { const b = billDateFor(t.date, card); (groups[b] = groups[b] || []).push(t); });
  const keys = Object.keys(groups).sort();
  const nextKey = keys.find(k => k >= t0) || null;
  let next = null, after = null;
  // 다음 결제일은 내역이 없어도 계산
  const nb = nextBillDate(card);
  const nr = billRec(card.id, nb);
  next = { date: nb, amount: nr ? +nr.amount : sum((groups[nb]||[]).map(signed)), period: periodFor(nb, card), count:(groups[nb]||[]).length, manual: !!nr };
  const ab = billDateFor(t0, card) === nb ? nextBillDate(card, nb) : billDateFor(t0, card);
  const ar = billRec(card.id, ab);
  after = { date: ab, amount: ar ? +ar.amount : sum((groups[ab]||[]).map(signed)), period: periodFor(ab, card), manual: !!ar };
  return { next, after, nextKey };
}
function nextBillDate(card, afterStr){
  const base = afterStr ? toDate(afterStr) : new Date();
  for (let k=0;k<3;k++){
    const mo = new Date(base.getFullYear(), base.getMonth()+k, 1);
    const d = ymd(new Date(mo.getFullYear(), mo.getMonth(), Math.min(+card.billDay||1, dim(mo.getFullYear(), mo.getMonth()+1))));
    if (afterStr ? d > afterStr : d >= today()) return d;
  }
  return today();
}
function nextDayOfMonth(day, fromStr){
  const f = toDate(fromStr || today());
  for (let k=0;k<2;k++){
    const mo = new Date(f.getFullYear(), f.getMonth()+k, 1);
    const d = ymd(new Date(mo.getFullYear(), mo.getMonth(), Math.min(+day||1, dim(mo.getFullYear(), mo.getMonth()+1))));
    if (d >= ymd(f)) return d;
  }
}
function guessCategory(merchant){
  if (!merchant) return '기타';
  const r = S.settings.rules[merchant.trim()];
  if (r && S.settings.categories.includes(r)) return r;
  const low = merchant.toLowerCase();
  for (const [cat, words] of CAT_WORDS) if (words.some(w => low.includes(w.toLowerCase())) && S.settings.categories.includes(cat)) return cat;
  const fx = live(S.fixed).find(f => f.name && merchant.includes(f.name));
  if (fx) return FIXED_CAT;
  const sp = live(S.special).find(f => f.name && merchant.includes(f.name));
  if (sp) return SPECIAL_CAT;
  return '기타';
}

// 카드사마다 문자 모양이 달라서, 정해진 줄 순서 대신 "알아볼 수 있는 것부터 지우고 남은 것"으로 가게 이름을 찾는다.
function cleanSeg(s){
  return s
    .replace(/\[(Web|웹|국외)발신\]/g,' ')
    .replace(/(누적|잔액|잔고|이용가능|사용가능|가능)\s*(금액|한도)?\s*[:：]?\s*-?[\d,]+\s*원?/g,' ')
    .replace(/-?[\d,]+\s*원/g,' ')
    .replace(/\(?\s*(일시불|할부|\d+\s*개월|무이자)\s*\)?/g,' ')
    .replace(/\d{2,4}[\/.\-]\d{1,2}[\/.\-]\d{1,2}/g,' ')
    .replace(/\d{1,2}[\/.\-]\d{1,2}/g,' ')
    .replace(/\d{1,2}월\s?\d{1,2}일/g,' ')
    .replace(/\d{1,2}:\d{2}(:\d{2})?/g,' ')
    .replace(/[가-힣A-Za-z]*\(\s*[\d*\-]{2,}\s*\)/g,' ')
    .replace(/\S*\*\S*/g,' ')
    .replace(/(체크카드|신용카드|하이브리드|승인취소|취소승인|체크승인|신용승인|해외승인|승인|취소|출금|입금|결제완료|사용|소액신용|님)/g,' ')
    .replace(/^\s*[\d\s\-]+\s*$/,' ')
    .replace(/[|:：·,]+/g,' ')
    .replace(/\s+/g,' ').trim();
}
function cardKeys(c){ return String(c.keys||c.name||'').split(',').map(s=>s.trim()).filter(Boolean); }
function parseSms(text){
  const raw = String(text||'').replace(/\r/g,'').replace(/ /g,' ');
  const lines = raw.split('\n').map(s=>s.trim()).filter(Boolean);
  const flat = lines.join(' ');
  const now = new Date();
  // 금액: 누적·잔액 바로 뒤 숫자는 건너뛴다
  let amount = null;
  const re = /(-?[0-9]{1,3}(?:,[0-9]{3})+|-?[0-9]+)\s*원/g; let m;
  while ((m = re.exec(flat))){
    const before = flat.slice(Math.max(0, m.index-10), m.index);
    if (/(누적|잔액|잔고|한도|이용가능|사용가능|가능금액)\s*(금액)?\s*[:：]?\s*$/.test(before)) continue;
    amount = Math.abs(parseInt(m[1].replace(/,/g,''),10)); break;
  }
  if (!amount){ const k = flat.match(/KRW\s*([\d,]+)/i); if (k) amount = parseInt(k[1].replace(/,/g,''),10); }
  // 날짜·시간
  let date = today(), time = '';
  let dm = flat.match(/(20\d{2})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
  if (dm) date = `${dm[1]}-${pad(dm[2])}-${pad(dm[3])}`;
  else {
    dm = flat.match(/(?:^|[^\d])(\d{1,2})[\/.\-](\d{1,2})(?![\d,])/) || flat.match(/(\d{1,2})월\s?(\d{1,2})일/);
    if (dm){
      const mo = +dm[1], da = +dm[2];
      if (mo>=1 && mo<=12 && da>=1 && da<=31){
        let y = now.getFullYear();
        if (mo > now.getMonth()+2) y -= 1;
        date = `${y}-${pad(mo)}-${pad(da)}`;
      }
    }
  }
  const tm = flat.match(/(\d{1,2}):(\d{2})/);
  if (tm && +tm[1] < 24) time = `${pad(tm[1])}:${tm[2]}`;
  // 가게 이름: 줄마다 알아볼 수 있는 것을 지우고 남은 것. 시간 줄 뒤에 남은 것을 먼저 고른다.
  const cleaned = lines.map(cleanSeg);
  const ti = lines.findIndex(l => /\d{1,2}:\d{2}/.test(l));
  let merchant = '';
  if (ti >= 0){
    const afterTime = cleanSeg(lines[ti].split(/\d{1,2}:\d{2}(?::\d{2})?/).slice(1).join(' '));
    if (afterTime) merchant = afterTime;
    for (let i=ti+1; !merchant && i<cleaned.length; i++) if (cleaned[i]) merchant = cleaned[i];
  }
  if (!merchant) merchant = cleaned.filter(Boolean).pop() || '';
  // 카드 이름만 남은 경우(예: "하나카드")는 버린다
  const allKeys = S.settings.cards.flatMap(cardKeys);
  if (allKeys.some(k => merchant.replace(/카드|체크|BC|SOL|\s/gi,'') === k)) merchant = '';
  merchant = merchant.slice(0,40);
  // 카드: 가게 이름을 뺀 나머지에서 찾는다 (가게 이름에 '우리'가 들어가도 헷갈리지 않게)
  const head = merchant ? flat.replace(merchant, ' ') : flat;
  let card = null;
  for (const c of S.settings.cards){ if (cardKeys(c).some(k => head.includes(k))) { card = c; break; } }
  const refund = /취소/.test(flat) && !/취소\s*가능/.test(flat);
  let pay = 'check';
  if (card){
    if (card.kind === 'credit') pay = 'credit';
    else if (card.kind === 'hybrid' && /(소액\s?신용|신용\s?승인|\(신용\)|신용\s?결제|하이브리드)/.test(flat)) pay = 'small';
  }
  return { ok: !!amount, amount, date, time, merchant, card, method: card ? card.id : '', pay, refund, category: guessCategory(merchant) };
}

function viewHistory(){
  const c = monthCalc(ui.month);
  const cats = {};
  c.txs.forEach(t => cats[t.category] = (cats[t.category]||0) + signed(t));
  if (c.lumpSum) cats['카드 합계 (내역 없음)'] = c.lumpSum;
  const catList = Object.entries(cats).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const maxC = Math.max(1, ...catList.map(x=>x[1]));
  const total = sum(c.txs.map(signed)) + c.lumpSum;
  const first = new Date(c.y, c.m-1, 1).getDay();
  let cal = WD.map(w=>`<div class="h">${w}</div>`).join('') + '<div></div>'.repeat(first);
  for (const d of c.list){
    const cls = {'future':'future','pre':'pre','kept':'kept','nospend':'nospend','over':'over','today-ok':'kept today','today-over':'over today'}[d.status];
    cal += `<div class="d ${cls}" title="${d.ds} ${won(d.v)}"><span class="n">${d.d}</span><span class="v">${d.v? wonShort(d.v): (d.status==='nospend'?'0':'')}</span></div>`;
  }
  let txs = c.txs.slice().sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  if (ui.cat) txs = txs.filter(t => t.category === ui.cat);
  let listHtml = '', cur = null, buf = [];
  const flush = () => { if (cur){ const daySum = sum(buf.map(signed)); listHtml += `<div class="dayhead"><span>${md(cur)}</span><span class="num">${won(daySum)}</span></div>` + buf.map(txItem).join(''); } };
  for (const t of txs){ if (t.date !== cur){ flush(); cur = t.date; buf = []; } buf.push(t); }
  flush();
  const isNow = ui.month === ym(new Date());
  return `
  <div class="monthnav">
    <button class="iconbtn" data-act="month" data-d="-1" type="button" aria-label="이전 달">${ARROW_L}</button>

  </div>
  <section class="grid2">
    <div class="tile"><span class="label">쓴 돈</span><span class="val">${won(total)}</span><span class="tiny muted">정기 지출 ${won(c.fixedPaid)} 포함</span></div>
    <div class="tile"><span class="label">예산 지킨 날</span><span class="val">${c.kept}<span class="small muted"> / ${c.counted}일</span></span><span class="tiny muted">무지출 ${c.nospend}일 · 초과 ${c.over}일</span></div>
  </section>
  <section class="card stack" aria-labelledby="h-cal">
    <div class="row between"><h2 id="h-cal">날짜별 지출</h2><span class="small muted">하루 예산 ${won(c.daily)}</span></div>
    <div class="cal">${cal}</div>
    <div class="keyrow"><span><i style="background:var(--accent-soft)"></i>예산 안</span><span><i style="background:var(--accent)"></i>무지출</span><span><i style="background:var(--bad-bg)"></i>초과</span></div>
  </section>
  <section class="card stack" aria-labelledby="h-cat">
    <div class="row between"><h2 id="h-cat">카테고리</h2>${ui.cat?`<button class="btn sm" data-act="cat" data-c="" type="button">전체 보기</button>`:'<span class="small muted">눌러서 거르기</span>'}</div>
    <div class="cats">${catList.length ? catList.map(([k,v])=>`<button class="catrow ${ui.cat===k?'sel':(ui.cat?'dim':'')}" data-act="cat" data-c="${esc(k)}" type="button"><span>${esc(k)}</span><span class="track"><b style="width:${v/maxC*100}%"></b></span><span class="v num">${won(v)} <span class="muted">${Math.round(v/Math.max(1,total)*100)}%</span></span></button>`).join('') : '<div class="empty">이 달에는 기록이 없어요.</div>'}</div>
  </section>
  ${transitSection(ui.month)}
  <section class="card stack" aria-labelledby="h-lump">
    <div class="row between"><h2 id="h-lump">결제 금액만 적은 카드</h2><button class="btn sm" data-act="lump-add" data-m="${ui.month}" type="button">결제 금액 적기</button></div>
    ${c.lumps.length ? `<div class="list">${c.lumps.map(l => `<button class="item" type="button" data-act="lump-edit" data-id="${l.id}"><span class="ic" aria-hidden="true">합</span><span class="main"><span class="t">${esc(cardLabel(l.card))} ${mdShort(l.billDate)} 결제</span><span class="s">${mdShort(l.period[0])}~${mdShort(l.period[1])} 사용분 · 적어 둔 내역 ${won(l.recorded)} · 내역 없음 ${won(l.extra)}</span></span><span class="amt">${won(l.amount)}</span></button>`).join('')}</div>` : `<div class="small muted">카드 내역을 하나하나 적기 힘든 달은 카드사 앱의 결제 금액만 적어도 돼요. 이미 적은 내역은 빼고 나머지만 이 달 지출로 더해요. 날짜별 예산 지킨 날 계산에는 들어가지 않아요.</div>`}
  </section>
  <section class="card" aria-labelledby="h-all">
    <h2 id="h-all">${ui.cat?esc(ui.cat)+' 내역':'전체 내역'}</h2>
    <div class="list">${listHtml || '<div class="empty">기록이 없어요.</div>'}</div>
  </section>`;
}

/* ============ 화면: 카드 ============ */
const KIND = {credit:'신용', check:'체크', hybrid:'체크 · 소액신용'};
const KIND_EN = {credit:'CREDIT', check:'CHECK', hybrid:'CHECK'};
function shade(hex, amt){
  const n = parseInt(String(hex||'#888888').replace('#',''),16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + (amt<0 ? v*amt : (255-v)*amt))));
  return '#' + [f(n>>16), f((n>>8)&255), f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function cardFace(card){
  const img = S.images && S.images[card.id] && S.images[card.id].data;
  const sel = ui.card === card.id;
  if (img) return `<button class="cardface ${sel?'sel':''}" type="button" data-act="pick-card" data-id="${card.id}" aria-pressed="${sel}" aria-label="${esc(cardLabel(card))}"><img src="${img}" alt=""></button>`;
  const c = card.color || '#5B6472';
  return `<button class="cardface gen ${sel?'sel':''}" type="button" data-act="pick-card" data-id="${card.id}" aria-pressed="${sel}" aria-label="${esc(cardLabel(card))}" style="background:linear-gradient(135deg, ${shade(c,.12)} 0%, ${c} 45%, ${shade(c,-.38)} 100%)">
    <span class="f-top"><span class="f-name">${esc(card.name)}</span><svg class="f-nfc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8.5 8a6 6 0 0 1 0 8M12 5.5a10 10 0 0 1 0 13M15.5 3a14 14 0 0 1 0 18"/></svg></span>
    <span class="f-chip"></span>
    <span class="f-bot"><span>${card.kind==='check'?'바로 출금':`매달 ${card.billDay}일 결제`}</span><span class="f-kind">${KIND_EN[card.kind]||''}</span></span>

}
function cardDetail(card){

  const all = live(S.tx).filter(t => t.method === card.id);

  const recent = all.slice().sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||''))).slice(0,5);
  const dd = Math.max(0, daysBetween(t0, b.next.date));

  <div class="cd-head">

    <button class="btn sm" data-act="card-photo" data-id="${card.id}" type="button">${S.images&&S.images[card.id]?'사진 바꾸기':'카드 사진 넣기'}</button>
  </div>
  ${later ? `
  <div class="cd-rows">
    <div><span class="muted">그다음 결제 (${mdShort(b.after.date)})</span><b class="num">${won(b.after.amount)}</b></div>
    <div><span class="muted">이번 달 체크로 바로 나간 돈</span><b class="num">${won(monCheck)}</b></div>
    <div><span class="muted">이번 달 결제일에 나갈 돈</span><b class="num">${won(monLater)}</b></div>

  ${plans.length ? `<div>
    <div class="row between" style="margin-bottom:2px"><h3>이 카드로 나갈 정기 · 특별 지출</h3><span class="small muted num">${won(sum(plans.map(p=>p.amount)))}</span></div>
    <div class="list">${plans.map(planRow).join('')}</div>
  </div>` : ''}
  <div>
    <div class="row between" style="margin-bottom:2px"><h3>최근 내역</h3><span class="small muted">${all.length}건</span></div>
    <div class="list">${recent.length ? recent.map(txItem).join('') : '<div class="empty">이 카드로 기록된 내역이 없어요.</div>'}</div>

}
function cardTop(card){
  const t0 = today();
  const later = card.kind !== 'check';

    const mon = sum(live(S.tx).filter(t => t.method===card.id && t.date.startsWith(ym(new Date())) && t.pay==='check').map(signed));

    ${total?`<div class="top-all">다가오는 카드값 전체 <b class="num">${won(total)}</b></div>`:''}`;
}

/* 카드 덱: 좌우 = 카드사, 위아래 = 같은 카드사의 다른 카드. 고른 카드는 앞으로, 나머지는 뒤로 겹친다 */
const cardLabel = c => /카드|체크/.test(c.name) ? c.name : c.name + '카드';
function companies(){
  const order = [], map = {};
  S.settings.cards.forEach(c => { const co = c.company || c.name; if (!map[co]){ map[co] = []; order.push(co); } map[co].push(c); });
  return order.map(co => ({co, cards: map[co]}));
}
function frontOf(g, ci, gi){ return gi === ci ? ui.card : (ui.lastByCo[g.co] && g.cards.some(c=>c.id===ui.lastByCo[g.co]) ? ui.lastByCo[g.co] : g.cards[0].id); }
function deckHtml(){
  const cos = companies();
  const multi = cos.some(g => g.cards.length > 1);

function layoutDeck(dragX=0, dragY=0){
  const deck = document.getElementById('deck'); if (!deck) return;
  const cos = companies(); const sel = cardById(ui.card);
  const ci = Math.max(0, cos.findIndex(g => g.cards.includes(sel)));
  const W = deck.clientWidth || 360;
  const cw = Math.min(320, W * 0.72), ch = cw / 1.586;
  const stepX = cw * 0.62, stepY = 22;
  const cur = cos[ci];
  const peek = cur && cur.cards.length > 1 ? 2 * stepY + 8 : 8;
  deck.style.height = Math.round(ch + peek * 2 + 8) + 'px';
  deck.style.setProperty('--cw', cw + 'px');
  deck.style.touchAction = cur && cur.cards.length > 1 ? 'none' : 'pan-y';
  cos.forEach((g, gi) => {
    const front = frontOf(g, ci, gi);
    const si = Math.max(0, g.cards.findIndex(c => c.id === front));
    g.cards.forEach((c, k) => {
      const el = deck.querySelector(`.cardface[data-id="${c.id}"]`); if (!el) return;
      const dx = gi - ci + dragX / stepX;
      const dy = (k - si) + (gi === ci ? dragY / (stepY * 3) : 0);
      const adx = Math.abs(dx), ady = Math.abs(dy);
      const x = dx * stepX, y = dy * stepY;
      const scale = 1 - 0.14 * Math.min(adx, 2) - 0.06 * Math.min(ady, 3);
      const hide = adx > 1.7 || ady > 2.6 || (gi !== ci && k !== si && ady > 1.6);
      el.style.width = cw + 'px';
      el.style.transform = `translate(-50%,-50%) translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${scale.toFixed(3)})`;
      el.style.zIndex = String(100 - Math.round(adx * 10) - Math.round(ady * 10));
      el.style.opacity = hide ? '0' : '1';
      el.style.filter = `brightness(${(1 - 0.28 * Math.min(1, adx) - 0.18 * Math.min(1, ady)).toFixed(3)})`;
      el.style.pointerEvents = hide ? 'none' : 'auto';
      el.tabIndex = (gi === ci && k === si) ? 0 : -1;
      el.classList.toggle('sel', c.id === ui.card);
    });
  });
  const vd = document.getElementById('vdots');
  if (vd){
    if (cur && cur.cards.length > 1){ const si = cur.cards.findIndex(c=>c.id===ui.card); vd.innerHTML = cur.cards.map((c,k)=>`<i class="${k===si?'on':''}"></i>`).join(''); vd.style.display = 'flex'; }
    else vd.style.display = 'none';
  }
}
function moveCompany(d){
  const cos = companies(); const ci = cos.findIndex(g => g.cards.some(c=>c.id===ui.card));

/* 카드 사진: 배경을 찾아 카드만 잘라내고(직접 조정 가능), 카드 비율(1.586:1)로 작게 저장 */
let photoFor = null;
function pickPhoto(id){ photoFor = id; const i = document.getElementById('cardImgIn'); i.value = ''; i.click(); }
async function fileToCanvas(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv;
  } finally { URL.revokeObjectURL(url); }
}
// 가장자리 색을 배경으로 보고, 배경과 다른 영역 중 가장 큰 덩어리의 사각형을 카드로 본다
function findCard(src){
  const A = 320, k = Math.min(1, A / Math.max(src.width, src.height));
  const w = Math.max(8, Math.round(src.width * k)), h = Math.max(8, Math.round(src.height * k));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d', {willReadFrequently:true}); g.drawImage(src, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data;
  const at = (x,y) => { const i = (y*w + x)*4; return [px[i], px[i+1], px[i+2]]; };
  const border = [];
  const b = Math.max(2, Math.round(Math.min(w,h) * 0.02));
  for (let x=0; x<w; x+=2) for (let t=0; t<b; t++){ border.push(at(x,t)); border.push(at(x,h-1-t)); }
  for (let y=0; y<h; y+=2) for (let t=0; t<b; t++){ border.push(at(t,y)); border.push(at(w-1-t,y)); }
  const med = [0,1,2].map(c => { const v = border.map(p=>p[c]).sort((a,b)=>a-b); return v[v.length>>1]; });
  const dist = p => Math.hypot(p[0]-med[0], p[1]-med[1], p[2]-med[2]);
  const bd = border.map(dist).sort((a,b)=>a-b);
  const th = Math.max(26, bd[Math.floor(bd.length*0.9)] * 1.6);
  const mask = new Uint8Array(w*h);
  // 색 있는 바닥(책상 등)에서는 같은 색이 어두워진 곳을 그림자로 보고 배경에 넣는다
  const lumB = med[0]+med[1]+med[2] || 1, satB = (Math.max(...med) - Math.min(...med)) / 255;
  const isShadow = p => { const L = p[0]+p[1]+p[2]; if (satB < 0.08 || !L) return false; const r = L/lumB; if (r < 0.3 || r > 0.97) return false; return Math.hypot(p[0]/L-med[0]/lumB, p[1]/L-med[1]/lumB, p[2]/L-med[2]/lumB) < 0.05; };
  for (let y=0; y<h; y++) for (let x=0; x<w; x++){ const p = at(x,y); if (dist(p) > th && !isShadow(p)) mask[y*w+x] = 1; }
  // 가장 큰 덩어리
  const lab = new Int32Array(w*h).fill(-1); let best = null;
  for (let s=0; s<w*h; s++){
    if (!mask[s] || lab[s] >= 0) continue;
    const st = [s]; lab[s] = s; let n = 0, x0=w, y0=h, x1=0, y1=0;
    while (st.length){
      const q = st.pop(), x = q % w, y = (q / w) | 0; n++;
      if (x<x0) x0=x; if (x>x1) x1=x; if (y<y0) y0=y; if (y>y1) y1=y;
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx = x+dx, ny = y+dy; if (nx<0||ny<0||nx>=w||ny>=h) continue;
        const r = ny*w+nx; if (mask[r] && lab[r] < 0){ lab[r] = s; st.push(r); }
      }
    }
    if (!best || n > best.n) best = {n, x0, y0, x1, y1};
  }
  const full = {x:0, y:0, w:src.width, h:src.height, auto:false};
  if (!best) return full;
  const bw = best.x1-best.x0+1, bh = best.y1-best.y0+1;
  const area = bw*bh/(w*h);
  if (area < 0.06 || area > 0.985) return full;
  return { x: best.x0/k, y: best.y0/k, w: bw/k, h: bh/k, auto:true };
}
function renderCrop(src, box){
  const portrait = box.h > box.w * 1.1; // 세로 카드는 눕혀서
  const W = 640, H = Math.round(640/1.586);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.imageSmoothingQuality = 'high';
  if (portrait){ g.translate(W/2, H/2); g.rotate(-Math.PI/2); g.drawImage(src, box.x, box.y, box.w, box.h, -H/2, -W/2, H, W); }
  else g.drawImage(src, box.x, box.y, box.w, box.h, 0, 0, W, H);

}

function methodCard(){
  const sv = live(S.savings); const total = sum(sv.map(svValue));
  if (!total) return '';
  const by = {}; sv.forEach(s => { const m = s.method || '기타'; by[m] = (by[m]||0) + svValue(s); });
  const list = Object.entries(by).sort((a,b)=>b[1]-a[1]); const max = Math.max(...list.map(x=>x[1]));
  return `<section class="card stack" aria-labelledby="h-sm">
    <h2 id="h-sm">어떻게 모았나</h2>
    <div class="cats">${list.map(([k,v])=>`<div class="catrow" style="cursor:default;grid-template-columns:84px 1fr 150px"><span>${esc(k)}</span><span class="track"><b style="width:${v/max*100}%"></b></span><span class="v num">${won(v)} <span class="muted">${Math.round(v/total*100)}%</span></span></div>`).join('')}</div>
  </section>`;
}

function monthLabel(ymStr){ const [y,m] = ymStr.split('-').map(Number); return y === new Date().getFullYear() ? `${m}월` : `${y}년 ${m}월`; }
function shiftYm(ymStr, d){ const [y,m] = ymStr.split('-').map(Number); return ym(new Date(y, m-1+d, 1)); }
function viewSavings(){
  const now = new Date(), curM = ym(now), maxM = shiftYm(curM, 1);

  const svAll = live(S.savings).sort((a,b)=>b.date.localeCompare(a.date));
  const total = sum(svAll.map(svValue));
  const principal = sum(svAll.map(s=>+s.amount||0)), fxGain = total - principal;
  const sv = svAll.filter(s => s.date.startsWith(M));
  const saved = sum(sv.map(s=>s.amount));
  const goals = live(S.goals);
  const sal = salaryFor(M);
  const salary = sal.net || 0, toBud = Math.min(+S.settings.salaryToBudget||0, salary);
  const rest = salary - saved - toBud;
  const isFuture = M > curM, isCur = M === curM;
  const sd = +S.settings.salaryDay;
  const pill = isFuture ? '<span class="pill plain">아직 안 온 달</span>'

      <div><span class="muted">− 저축</span><b class="num">${won(saved)}</b></div>
      ${toBud?`<div><span class="muted">− 생활비로 보탠 돈</span><b class="num">${won(toBud)}</b></div>`:''}
      <div class="tot"><span>남은 월급</span><b class="num" style="color:${rest<0?'var(--bad)':'var(--ink)'}">${won(rest)}</b></div>

      ${rows.map(r=>`<button class="mrow ${r.mm===M?'sel':''}" role="row" type="button" data-act="sv-go" data-m="${r.mm}"><span role="cell">${monthLabel(r.mm)}</span><span role="cell" class="num">${r.pay?wonShort(r.pay):'-'}<small>${r.pocket?wonShort(r.pocket):'-'}</small></span><span role="cell" class="num">${r.s2?wonShort(r.s2):'-'}</span><span role="cell" class="num"><b>${r.rate==null?'-':r.rate+'%'}</b><small>${r.rateAll==null?'-':r.rateAll+'%'}</small></span></button>`).join('')}

function krRead(n){ n = Math.round(+n||0); if (n >= 10000){ const man = Math.floor(n/10000), rest = n % 10000; return `${man.toLocaleString('ko-KR')}만${rest?' '+rest.toLocaleString('ko-KR'):''} 원`; } return `${n.toLocaleString('ko-KR')}원`; }
function amountHint(n, i){
  if (!n) return '';
  if (n < 10000) return `<span style="color:var(--warn)">${krRead(n)}이에요. 혹시 ${krRead(n*10000)}인가요?</span> <button class="link" type="button" data-act="al-man" data-i="${i}">${krRead(n*10000)}으로 고치기</button>`;
  return `<span class="muted">${krRead(n)}</span>`;
}

function render(){
  const tab = ui.tab;
  document.querySelectorAll('nav.tabs a').forEach(a => { const on = a.dataset.tab === tab; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const v = {today:viewToday, history:viewHistory, cards:viewCards, savings:viewSavings, prefs:viewPrefs}[tab] || viewToday;
  const sy = window.scrollY;
  $('#view').innerHTML = v();
  window.scrollTo(0, sy);
  if (tab === 'cards') layoutDeck();
  const d = new Date();
  $('#hdrSub').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`;
  $('#fab').style.display = (tab==='prefs') ? 'none' : 'flex';
  renderSync();
}
function route(){
  const h = (location.hash||'').replace('#','');
  if (h === 'savings') loadFx();
  ui.tab = ['today','history','cards','savings','prefs'].includes(h) ? h : 'today';
  render();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

function methodChips(sel){
  const opts = S.settings.cards.map(c=>({v:c.id,l:c.name+(c.kind==='credit'?' 신용':' 체크')})).concat([{v:'cash',l:'현금'},{v:'transfer',l:'계좌이체'}]);
  return opts.map(o=>`<button class="chip-b ${o.v===sel?'on':''}" type="button" data-pick="method" data-v="${o.v}">${esc(o.l)}</button>`).join('');
}

function openTx(t){
  const isNew = !t || !t.id || !live(S.tx).some(x=>x.id===t.id);
  const d = Object.assign({ date: today(), time:'', amount:'', merchant:'', category:'기타', method:(S.settings.cards[0]||{}).id||'cash', pay:'', memo:'', refund:false }, t||{});
  if (!d.pay) d.pay = payFor(d.method);
  sheetCtx = { kind:'tx', draft: d, isNew };

}
function payFor(method, cur){
  const c = cardById(method);
  if (method==='cash') return 'cash';
  if (method==='transfer') return 'transfer';
  if (!c) return 'check';
  if (c.kind==='credit') return 'credit';
  if (c.kind==='hybrid' && cur==='small') return 'small';
  return 'check';
}

/* 교통비 환급 (K-패스 등): 다음 달에 돌려받는 대중교통비 */
const NOT_TRANSIT = /택시|카카오T|카카오모빌|타다|KTX|SRT|코레일|고속|시외|주유|렌터카|쏘카|그린카/i;
const isRefundTx = t => t.kind === 'transit-refund' || (t.refund && t.merchant === '교통비 환급');
function transitFor(ymStr){
  const rate = +(S.settings.transit||{}).rate || 0;
  const all = live(S.tx);
  const rides = all.filter(t => t.date.startsWith(ymStr) && t.category === '교통' && !t.refund && !NOT_TRANSIT.test(t.merchant||''));
  const spend = sum(rides.map(t=>t.amount));
  const est = Math.floor(spend * rate / 100 / 10) * 10;
  const forThis = all.filter(t => isRefundTx(t) && t.refundFor === ymStr);
  const gotHere = all.filter(t => isRefundTx(t) && t.date.startsWith(ymStr));
  return { rate, spend, count: rides.length, est, received: sum(forThis.map(t=>t.amount)), forThis, gotHere };
}
function openTransit(month){
  const forM = month || shiftYm(ym(new Date()), -1);
  const est = transitFor(forM).est;
  const d = { forM, amount: est || '', date: today(), method: 'transfer' };
  sheetCtx = {kind:'transit', draft:d, isNew:true};
  drawTransit();
}
function drawTransit(){
  const d = sheetCtx.draft, t = transitFor(d.forM);
  const months = [0,1,2,3].map(k => shiftYm(ym(new Date()), -k));
  const opts = S.settings.cards.map(c=>({v:c.id, l:cardLabel(c)+(c.kind==='credit'?' (결제 금액에서 빠짐)':'')})).concat([{v:'transfer',l:'계좌로 들어옴'},{v:'cash',l:'포인트·기타'}]);

    <div class="small muted">K-패스처럼 다음 달에 돌려받은 대중교통비를 적어요. 받은 달의 지출에서 그만큼 빠져요.</div>

    <div class="field"><label for="trAmt">받은 금액</label><input class="amount-in num" id="trAmt" inputmode="numeric" data-num="1" placeholder="0원" value="${d.amount?(+d.amount).toLocaleString('ko-KR'):''}"></div>
    <div class="field"><label for="trDate">받은 날</label><input class="input" type="date" id="trDate" value="${d.date}"></div>
    <div class="field"><label>어디로 받았나요</label><div class="chips">${opts.map(o=>`<button class="chip-b ${o.v===d.method?'on':''}" type="button" data-pick="trm" data-v="${o.v}">${esc(o.l)}</button>`).join('')}</div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn main" data-act="tr-save" type="button">저장</button></div>`, sheetCtx);
}

function openLump(opts){
  const cards = S.settings.cards.filter(c => c.kind !== 'check');
  if (!cards.length){ toast('결제일이 있는 카드가 없어요'); return; }
  let d;
  if (opts.id){ const r = S.bills.find(b=>b.id===opts.id); d = {id:r.id, cardId:r.cardId, billDate:r.billDate, amount:r.amount}; }
  else {
    const card = cardById(opts.card) || cards.find(c=>c.kind==='credit') || cards[0];
    let bill = opts.bill;
    if (!bill && opts.month){ // 이 달 사용분이 청구되는 결제일
      const [y,m] = opts.month.split('-').map(Number);
      bill = billDateFor(`${opts.month}-${pad(Math.min(dim(y,m), (+card.cycleStart||1) > 1 ? (+card.cycleStart-1) : dim(y,m)))}`, card);
    }
    if (!bill) bill = nextBillDate(card);
    const ex = billRec(card.id, bill);
    d = ex ? {id:ex.id, cardId:ex.cardId, billDate:ex.billDate, amount:ex.amount} : {cardId:card.id, billDate:bill, amount:''};
  }
  sheetCtx = {kind:'lump', draft:d, isNew: !d.id};
  drawLump();
}
function drawLump(){
  const d = sheetCtx.draft, card = cardById(d.cardId);
  const dates = recentBillDates(card); if (!dates.includes(d.billDate)) dates.push(d.billDate);
  const per = periodFor(d.billDate, card), rec = recordedFor(card, d.billDate);
  openSheet(`
    <div class="row between"><h2>결제 금액만 적기</h2><button class="btn sm ghost" data-act="close" type="button">닫기</button></div>
    <div class="small muted">카드사 앱에 나오는 결제(청구) 금액을 그대로 적으세요. 그 기간에 이미 적어 둔 내역은 빼고, 남는 금액만 그 달 지출로 더해요.</div>
    <div class="field"><label>카드</label><div class="chips">${S.settings.cards.filter(c=>c.kind!=='check').map(c=>`<button class="chip-b ${c.id===d.cardId?'on':''}" type="button" data-pick="lcard" data-v="${c.id}">${esc(cardLabel(c))}</button>`).join('')}</div></div>
    <div class="field"><label for="lumpDate">결제일</label><select class="input" id="lumpDate">${dates.sort().reverse().map(x=>{ const p = periodFor(x, card); return `<option value="${x}" ${x===d.billDate?'selected':''}>${md(x)} · ${mdShort(p[0])}~${mdShort(p[1])} 사용분${billRec(card.id,x)&&x!==d.billDate?' (적어 둠)':''}</option>`; }).join('')}</select></div>
    <div class="field"><label for="lumpAmt">결제 금액</label><input class="amount-in num" id="lumpAmt" inputmode="numeric" data-num="1" placeholder="0원" value="${d.amount?(+d.amount).toLocaleString('ko-KR'):''}" autofocus></div>
    <div class="plan-sum"><div><span class="muted">${mdShort(per[0])}~${mdShort(per[1])} 이미 적은 내역</span><b class="num">${won(rec)}</b></div><div class="tot"><span>'내역 없음'으로 더할 금액</span><b class="num" id="lumpExtra">${won(Math.max(0,(+d.amount||0)-rec))}</b></div></div>
    <div class="row between"><div>${!sheetCtx.isNew?'<button class="btn ghost danger" data-act="lump-del" type="button">지우기</button>':''}</div><button class="btn main" data-act="lump-save" type="button">저장</button></div>`, sheetCtx);
}

document.addEventListener('input', e => {
  const el = e.target;
  if ((el.id === 'svFx' || el.id === 'svRate') && sheetCtx && sheetCtx.kind === 'saving'){ const d = sheetCtx.draft; const fx = parseFloat(($('#svFx').value||'').replace(/[^0-9.]/g,''))||0, r = parseFloat(($('#svRate').value||'').replace(/[^0-9.]/g,''))||0; const k = $('#svKrw'); if (k) k.textContent = won(Math.round(fx*r/curUnit(d.cur))); }
  if (el.id === 'lumpAmt' && sheetCtx && sheetCtx.kind === 'lump'){ setTimeout(() => { const d = sheetCtx.draft, card = cardById(d.cardId), x = $('#lumpExtra'); if (x) x.textContent = won(Math.max(0, (parseInt(el.value.replace(/[^0-9]/g,''),10)||0) - recordedFor(card, $('#lumpDate').value))); }, 0); }
  if (el.matches('#txAmt,#fxAmt,#svAmt,#gTarget,[data-num],[id^="st-"]')){
    // 쉼표를 넣어도 커서가 끝으로 튀지 않게, 커서 앞 숫자 개수를 기억했다가 되돌린다
    const pos = el.selectionStart ?? el.value.length;
    const before = el.value.slice(0, pos).replace(/[^0-9]/g,'').length;
    const n = el.value.replace(/[^0-9]/g,'');
    // 맨 앞 숫자를 지우고 새로 넣는 중(예: 200,000 → 00,000 → 500,000)이면 0을 없애지 않고 기다린다
    const f = !n ? '' : (/^0\d/.test(n) ? el.value : parseInt(n,10).toLocaleString('ko-KR'));
    if (f !== el.value){
      el.value = f;
      let k = 0, c = 0; while (k < f.length && c < before){ if (/\d/.test(f[k])) c++; k++; }
      try { el.setSelectionRange(k, k); } catch(err){}
    }
    if (/^al-a-\d+$/.test(el.id)){ const h = document.getElementById(el.id.replace('al-a-','al-h-')); if (h) h.innerHTML = amountHint(parseInt(n||'0',10), el.id.slice(5)); }
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'svCur' && sheetCtx && sheetCtx.kind === 'saving'){ readSaving(); const d = sheetCtx.draft; d.rate = fxRate(d.cur) ? +(fxRate(d.cur)*curUnit(d.cur)).toFixed(2) : ''; drawSaving(); return; }
  if (el.id === 'trFor' && sheetCtx && sheetCtx.kind === 'transit'){ readTransit(); const e2 = transitFor(sheetCtx.draft.forM).est; if (e2) sheetCtx.draft.amount = e2; drawTransit(); return; }
  if (el.id === 'lumpDate' && sheetCtx && sheetCtx.kind === 'lump'){ const d = sheetCtx.draft; d.amount = parseInt(($('#lumpAmt').value||'').replace(/[^0-9]/g,''),10)||''; d.billDate = el.value; const ex = billRec(d.cardId, d.billDate); if (ex){ d.id = ex.id; d.amount = ex.amount; sheetCtx.isNew = false; } else if (sheetCtx.isNew === false && d.id && !S.bills.some(b=>b.id===d.id && b.billDate===d.billDate)) { delete d.id; sheetCtx.isNew = true; } drawLump(); return; }
  if (el.id === 'cardImgIn'){
    const f = el.files && el.files[0]; if (!f || !photoFor) return;
    try { await startCrop(f, photoFor); }
    catch(err){ toast('사진을 읽지 못했어요. 다른 사진으로 해 주세요.'); }
    return;
  }
  if (!el.dataset.set) return;
  const path = el.dataset.set.split('.');
  let o = S.settings;
  for (let i=0;i<path.length-1;i++) o = o[path[i]];
  const k = path[path.length-1];
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.float) v = parseFloat(String(v).replace(/[^0-9.]/g,'')) || 0;
  else if (el.type === 'checkbox') {}
  else if (el.dataset.num || ['day','billDay','cycleStart','salaryDay'].includes(k)) v = parseInt(String(v).replace(/[^0-9]/g,''),10) || 0;
  o[k] = v;
  touch(S.settings);
  commit();
});
document.addEventListener('click', async e => {
  const pick = e.target.closest('[data-pick]');
  if (pick && sheetCtx){
    const d = sheetCtx.draft, k = pick.dataset.pick, v = pick.dataset.v;
    if (sheetCtx.kind==='tx'){
      readTxForm();
      if (k==='method'){ d.method = v; d.pay = payFor(v, d.pay); }
      else if (k==='pay') d.pay = v;
      else if (k==='refund') d.refund = v==='1';
      else if (k==='category') d.category = v;
      drawTxSheet();
    } else if (sheetCtx.kind==='saving' && k==='svm'){
      readSaving(); d.method = v;
      if (v === '외화'){ if (!d.rate && fxRate(d.cur)) d.rate = +(fxRate(d.cur)*curUnit(d.cur)).toFixed(2); loadFx(); }
      drawSaving();
    } else if (sheetCtx.kind==='transit' && k==='trm'){
      readTransit(); d.method = v; drawTransit();
    } else if (sheetCtx.kind==='lump' && k==='lcard'){
      d.amount = parseInt(($('#lumpAmt').value||'').replace(/[^0-9]/g,''),10)||''; d.cardId = v;
      const c2 = cardById(v); const ex = billRec(v, nextBillDate(c2)); d.billDate = nextBillDate(c2); if (ex){ d.id = ex.id; d.amount = ex.amount; sheetCtx.isNew = false; } else { delete d.id; sheetCtx.isNew = true; }
      drawLump();
    } else if (sheetCtx.kind==='plan' && k==='method'){
      readPlanForm(); d.method = v; const keepNew = sheetCtx.isNew;
      openPlan(d, sheetCtx.type); sheetCtx.isNew = keepNew;
    }
    return;
  }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;
  switch (act){
    case 'add': openTx(); break;
    case 'pick-card': if (Date.now() - (ui.dragAt||0) > 350) selectCard(id); break;
    case 'pick-co': { const g = companies().find(g=>g.co===btn.dataset.co); if (g){ const cur = cardById(ui.card); if (cur) ui.lastByCo[cur.company||cur.name] = ui.card; selectCard(frontOf(g,-1,0)); } break; }

    case 'crop-auto': if (sheetCtx && sheetCtx.kind==='crop'){ sheetCtx.box = findCard(sheetCtx.src); drawCropBox(); if (!sheetCtx.box.auto) toast('배경을 찾지 못했어요. 직접 맞춰 주세요.'); } break;
    case 'crop-full': if (sheetCtx && sheetCtx.kind==='crop'){ sheetCtx.box = {x:0,y:0,w:sheetCtx.src.width,h:sheetCtx.src.height,auto:false}; drawCropBox(); } break;
    case 'crop-save': if (sheetCtx && sheetCtx.kind==='crop'){ const c = sheetCtx; S.images[c.cardId] = {data: renderCrop(c.src, c.box), updatedAt: Date.now()}; ui.card = c.cardId; closeSheet(); commit(); toast('카드 사진을 넣었어요'); } break;
    case 'card-photo-del': S.images[id] = {data:'', updatedAt:Date.now()}; commit(); toast('사진을 지웠어요'); break;
    case 'close': closeSheet(); break;
    case 'go': location.hash = '#'+btn.dataset.to; break;
    case 'edit-tx': openTx(Object.assign({}, S.tx.find(t=>t.id===id))); break;
    case 'sms-fill': {
      readTxForm();
      const p = parseSms($('#smsIn').value);
      if (!p.ok){ toast('금액을 찾지 못했어요. 직접 적어 주세요.'); break; }
      Object.assign(sheetCtx.draft, {amount:p.amount, date:p.date, time:p.time, merchant:p.merchant, category:p.category, method:p.method||sheetCtx.draft.method, pay:p.method?p.pay:sheetCtx.draft.pay, refund:p.refund, source:'sms'});
      drawTxSheet(); toast(p.card ? `${p.card.name}카드 문자로 읽었어요` : '카드를 못 알아봤어요. 결제 수단을 골라 주세요.');
      break;
    }
    case 'tx-save': {
      readTxForm();
      const d = sheetCtx.draft;
      if (!d.amount){ toast('금액을 넣어 주세요'); break; }
      const prev = S.tx.find(t=>t.id===d.id);
      if (prev && prev.merchant && prev.category !== d.category) S.settings.rules[d.merchant] = d.category, touch(S.settings);
      if (!prev && d.merchant && d.category !== guessCategory(d.merchant)) S.settings.rules[d.merchant] = d.category, touch(S.settings);
